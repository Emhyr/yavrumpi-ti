<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yavruma Özel ♡</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#501628,#17080e 65%,#080406);color:#f7ead4;font-family:Georgia,serif}
button{cursor:pointer;border:1px solid #a07842;border-radius:11px;padding:13px 18px;background:linear-gradient(#662039,#2d0d19);color:#fff;font:inherit;font-weight:bold}.active{outline:2px solid #dfbf78}
#lobby{min-height:100vh;display:grid;place-items:center;padding:20px}.lobby{width:min(460px,100%);padding:35px;background:#180a0eee;border:1px solid #79572f;border-radius:22px;box-shadow:0 25px 80px #000}
h1{text-align:center;color:#ebcb8c;letter-spacing:5px}.lobby p{text-align:center;color:#c8b4a1}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.lobby button{width:100%}
#game{display:none;padding:12px;min-height:100vh}.top{max-width:1400px;margin:auto;display:grid;grid-template-columns:260px 1fr 260px;gap:15px;align-items:center}.box{background:#18090dcc;border:1px solid #76532f;border-radius:14px;padding:11px}.name{font-size:20px;color:#efd39a}.small{color:#bda998;font-size:13px}.title{text-align:center}.title h1{margin:0}.title div{font-size:12px;color:#aa9584;letter-spacing:3px}
.table{position:relative;max-width:1400px;width:100%;height:calc(100vh - 145px);min-height:590px;margin:10px auto;border:8px solid #3c291b;border-radius:45%/14%;background:radial-gradient(ellipse,#621c31,#431222 55%,#2b0b15);box-shadow:inset 0 0 0 2px #9a6d3a,inset 0 0 70px #15060a;overflow:hidden}.table:before{content:"♡";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:180px;color:#e68da0;opacity:.05}
.opponent{position:absolute;top:20px;left:50%;transform:translateX(-50%)}.opcards{display:flex;height:78px}.back{width:72px;height:104px;margin-left:-22px;border:4px solid #f1dfbd;border-radius:9px;background:repeating-linear-gradient(45deg,#741d38 0 7px,#e1c087 7px 9px,#741d38 9px 16px);position:relative;box-shadow:0 5px 12px #0008}.back:after{content:"♡";position:absolute;inset:11px;border:1px solid #e1c087;display:grid;place-items:center;color:#e1c087;font-size:27px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:35px}.card{width:84px;height:120px;border-radius:10px;background:linear-gradient(145deg,#fff9eb,#e8ddc7);border:1px solid #bba98b;color:#151014;box-shadow:0 8px 16px #0009;position:relative;display:flex;align-items:center;justify-content:center;font-weight:bold}.card .c{position:absolute;top:7px;left:9px;font-size:17px}.card .s{font-size:47px}.red{color:#ae2944}.discard{width:84px;height:120px;border:1px dashed #b78275;border-radius:10px;display:grid;place-items:center;color:#b99b91;font-size:10px;text-align:center}
.hand{position:absolute;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);height:145px;display:flex;align-items:flex-end}.hand .card{margin-left:-25px;cursor:pointer;transition:.18s}.hand .card:first-child{margin-left:0}.hand .card:hover{transform:translateY(-22px);margin-left:-14px}
.status{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);background:#16080ddd;border:1px solid #76512e;border-radius:20px;padding:9px 18px;white-space:nowrap}.bottom{max-width:1400px;margin:auto;color:#a99686;font-size:13px;display:flex;justify-content:space-between}
@media(max-width:800px){.top{grid-template-columns:1fr 1fr}.title{grid-column:1/-1;grid-row:1}.table{height:610px}.center{gap:12px}.hand{transform:translateX(-50%) scale(.82);transform-origin:bottom}.status{bottom:150px}}

/* --- Animasyonlar --- */
@keyframes cardDeal{from{opacity:0;transform:translateY(-35px) rotate(-8deg) scale(.92)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
@keyframes cardPlay{0%{transform:translateY(0) rotate(0) scale(1)}45%{transform:translateY(-90px) rotate(4deg) scale(1.04)}100%{transform:translateY(0) rotate(0) scale(1)}}
@keyframes captureFlash{0%{box-shadow:0 8px 16px #0009}35%{box-shadow:0 0 0 8px #e8c98333,0 0 35px #e8c983aa}100%{box-shadow:0 8px 16px #0009}}
@keyframes scorePop{0%{transform:scale(1);color:#e8c983}45%{transform:scale(1.45);color:#fff0b8;text-shadow:0 0 18px #e8c983}100%{transform:scale(1);color:#e8c983}}
@keyframes statusPulse{0%,100%{box-shadow:0 0 0 0 #e8c98300}50%{box-shadow:0 0 0 8px #e8c98318}}
@keyframes turnGlow{0%,100%{border-color:#76512e}50%{border-color:#e8c983;box-shadow:0 0 25px #e8c98333}}
@keyframes floatPoint{0%{opacity:0;transform:translate(-50%,15px) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.1)}75%{opacity:1;transform:translate(-50%,-38px) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(.9)}}
@keyframes pistiBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.55) rotate(-5deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(1deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.22)}}
.card.playing{animation:cardPlay .42s ease}
.card.new-card{animation:cardDeal .35s ease both}
.card.capture-flash{animation:captureFlash .55s ease}
#status.turn-active{animation:turnGlow 1.2s ease-in-out infinite}
.score-pop{animation:scorePop .65s ease}
.point-float{position:absolute;left:50%;top:50%;z-index:20;pointer-events:none;font-size:30px;font-weight:bold;color:#ffe7a6;text-shadow:0 2px 8px #000,0 0 18px #e8c983;animation:floatPoint 1.25s ease forwards}
.pisti-burst{position:absolute;left:50%;top:50%;z-index:30;pointer-events:none;color:#ffe7a6;font-size:42px;font-weight:bold;letter-spacing:5px;text-shadow:0 3px 14px #000,0 0 28px #d99a42;animation:pistiBurst 1.45s ease forwards}
.pisti-burst small{display:block;font-size:15px;letter-spacing:2px;text-align:center;margin-top:4px}
 .deck-pop{animation:scorePop .45s ease}
@keyframes flyFromMe{0%{opacity:0;transform:translate(-50%,120px) rotate(-8deg) scale(.75)}18%{opacity:1}70%{opacity:1;transform:translate(-50%,-35px) rotate(3deg) scale(1.05)}100%{opacity:0;transform:translate(-50%,-5px) rotate(0) scale(1)}}
@keyframes flyFromOpp{0%{opacity:0;transform:translate(-50%,-150px) rotate(8deg) scale(.75)}18%{opacity:1}70%{opacity:1;transform:translate(-50%,-35px) rotate(-3deg) scale(1.05)}100%{opacity:0;transform:translate(-50%,-5px) rotate(0) scale(1)}}
@keyframes tableFlash{0%{box-shadow:inset 0 0 0 2px #9a6d3a,inset 0 0 70px #15060a}35%{box-shadow:inset 0 0 0 3px #e8c983,inset 0 0 90px #e8c98333,0 0 45px #e8c98355}100%{box-shadow:inset 0 0 0 2px #9a6d3a,inset 0 0 70px #15060a}}
@keyframes shufflePulse{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-2deg)}}
@keyframes dealFly{0%{opacity:0;transform:translate(-50%,80px) rotate(12deg) scale(.7)}100%{opacity:1;transform:translate(-50%,0) rotate(0) scale(1)}}
.flying-card{position:absolute;left:50%;top:50%;z-index:40;width:84px;height:120px;border-radius:10px;background:linear-gradient(145deg,#fff9eb,#e8ddc7);border:1px solid #bba98b;color:#151014;box-shadow:0 10px 28px #000b;display:flex;align-items:center;justify-content:center;font-weight:bold;pointer-events:none}
.flying-card .c{position:absolute;top:7px;left:9px;font-size:17px}.flying-card .s{font-size:47px}.flying-card.red{color:#ae2944}.flying-me{animation:flyFromMe .58s cubic-bezier(.2,.75,.25,1) forwards}.flying-opp{animation:flyFromOpp .58s cubic-bezier(.2,.75,.25,1) forwards}
.table.flash{animation:tableFlash .7s ease}.deck-shuffle{animation:shufflePulse .55s ease}.deal-fly{animation:dealFly .4s ease both}
</style></head><body>
<section id="lobby"><div class="lobby"><h1>YAVRUMA ÖZEL ♡</h1><p>Senin için hazırladığım küçük bir oyun</p>
<div class="roles"><button id="host" class="active" onclick="pick('host')">Yakışıklım</button><button id="guest" onclick="pick('guest')">Yavrum</button></div>
<button onclick="enter()">Masaya Gir</button></div></section>
<section id="game"><div class="top"><div class="box"><div class="name" id="opp">Yavrum ♡</div><div class="small">Puan: <b id="os">0</b></div></div>
<div class="title"><h1>PİŞTİ ♡</h1><div id="turn">BAĞLANIYOR</div></div><div class="box" style="text-align:right"><div class="small">DESTEDE KALAN</div><div id="dc" style="font-size:27px;color:#e8c983">24</div></div></div>
<div class="table"><div class="opponent"><div id="opcards" class="opcards"></div></div><div class="center"><div class="back"></div><div id="discard" class="discard">YERE ATILAN<br>KARTLAR</div></div><div id="status" class="status">Bağlanıyor...</div><div id="hand" class="hand"></div></div>
<div class="bottom"><span id="me">Yakışıklım ♡</span><span>Benim puanım: <b id="myScore">0</b> &nbsp;·&nbsp; Yavruma özel ♡</span></div></section>
<script>
let role="host",ws,state=null;
const lobbyEl=document.getElementById("lobby"), gameEl=document.getElementById("game"), hostEl=document.getElementById("host"), guestEl=document.getElementById("guest"), meEl=document.getElementById("me"), oppEl=document.getElementById("opp"), statusEl=document.getElementById("status");
const handEl=document.getElementById("hand"), opcardsEl=document.getElementById("opcards"), discardEl=document.getElementById("discard"), turnEl=document.getElementById("turn"), deckCountEl=document.getElementById("dc"), myScoreEl=document.getElementById("myScore"), oppScoreEl=document.getElementById("os");
function pick(r){role=r;hostEl.classList.toggle("active",r==="host");guestEl.classList.toggle("active",r==="guest")}
function enter(){
 lobbyEl.style.display="none";gameEl.style.display="block";meEl.textContent=(role==="host"?"Yakışıklım":"Yavrum")+" ♡";oppEl.textContent=(role==="host"?"Yavrum":"Yakışıklım")+" ♡";
 const wsUrl=(location.protocol==="https:"?"wss://":"ws://")+location.host;
 statusEl.textContent="Bağlanıyor...";
 try{ws=new WebSocket(wsUrl);}catch(e){statusEl.textContent="Bağlantı başlatılamadı";return;}
 ws.onopen=()=>{statusEl.textContent="Odaya bağlandı";ws.send(JSON.stringify({type:"join",role}));};
 ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="state"){state=m.state;render()}else if(m.type==="event"){handleEvent(m.event)}else if(m.type==="error"){statusEl.textContent=m.message}};
 ws.onerror=()=>statusEl.textContent="Sunucu bağlantısı kurulamadı";
 ws.onclose=()=>statusEl.textContent="Bağlantı kesildi";
}
function card(c,click){
  let d=document.createElement("div");
  d.className="card "+((c.suit==="♥"||c.suit==="♦")?"red":"");
  d.innerHTML='<span class="c">'+c.rank+c.suit+'</span><span class="s">'+c.suit+'</span>';
  if(click)d.onclick=()=>playCardAnimated(d,c.id);
  return d;
}
function playCardAnimated(el,id){
  if(!state)return;
  let meI=role==="host"?0:1;
  if(state.turn!==meI)return;
  el.classList.add("playing");
  setTimeout(()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"play",id}));},170);
}
function animateScore(which){
  const el=which===0?document.getElementById("os"):document.getElementById("myScore");
  if(el){el.classList.remove("score-pop");void el.offsetWidth;el.classList.add("score-pop");}
}
function showPoint(points,label){
  const table=document.querySelector(".table");
  const d=document.createElement("div");d.className="point-float";d.textContent=(label?label+"  ":"")+"+"+points;
  table.appendChild(d);setTimeout(()=>d.remove(),1300);
}
function showPisti(points){
  const table=document.querySelector(".table");
  const d=document.createElement("div");d.className="pisti-burst";d.innerHTML="PİŞTİ!<small>+"+points+" PUAN</small>";
  table.appendChild(d);setTimeout(()=>d.remove(),1500);
}
function flyCard(c,player){
  const table=document.querySelector(".table");
  const d=document.createElement("div");
  d.className="flying-card "+((c.suit==="♥"||c.suit==="♦")?"red ":"")+(player===(role==="host"?0:1)?"flying-me":"flying-opp");
  d.innerHTML='<span class="c">'+c.rank+c.suit+'</span><span class="s">'+c.suit+'</span>';
  table.appendChild(d);setTimeout(()=>d.remove(),650);
}
function flashTable(){
  const t=document.querySelector(".table");t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash");
}
function handleEvent(ev){
  if(!ev)return;
  if(ev.type==="play"){
    if(ev.card)flyCard(ev.card,ev.player);
    if(ev.kind==="capture")flashTable();
    if(ev.points>0){showPoint(ev.points,"");}
    if(ev.kind==="pisti")showPisti(ev.points);
  }
  if(ev.type==="finish" && ev.bonus>0){showPoint(ev.bonus,"Çok kart");}
  if(ev.type==="deal"){
    const b=document.querySelector(".back");if(b){b.classList.remove("deck-shuffle");void b.offsetWidth;b.classList.add("deck-shuffle");}
  }
}
let lastScores=[0,0],lastDeckCount=null,lastHandSignature="";
function render(){
  let meI=role==="host"?0:1,opI=1-meI;
  if(!state || !Array.isArray(state.myHand)) return;
  const oldOpp=Number(oppScoreEl.textContent||0), oldMe=Number(myScoreEl.textContent||0);
  oppScoreEl.textContent=state.scores[opI];
  myScoreEl.textContent=state.scores[meI];
  if(state.scores[opI]!==oldOpp)animateScore(opI);
  if(state.scores[meI]!==oldMe)animateScore(meI);
  if(lastDeckCount!==null && state.deckCount!==lastDeckCount){deckCountEl.classList.remove("deck-pop");void deckCountEl.offsetWidth;deckCountEl.classList.add("deck-pop");}
  lastDeckCount=state.deckCount;
  deckCountEl.textContent=state.deckCount;
  turnEl.textContent=state.turn===meI?"SIRA SENDE ♡":"DİĞER OYUNCUNUN SIRASI";
  statusEl.textContent=state.turn===meI?"Kartını seç ♡":"Rakibinin sırası";
  status.classList.toggle("turn-active",state.turn===meI);
  opcardsEl.innerHTML="";
  for(let i=0;i<state.opponentCardCount;i++){
    let b=document.createElement("div");b.className="back new-card";b.style.animationDelay=(i*35)+"ms";opcardsEl.appendChild(b);
  }
  handEl.innerHTML="";
  state.myHand.forEach((c,i)=>{let el=card(c,state.turn===meI);el.classList.add("new-card");el.style.animationDelay=(i*45)+"ms";handEl.appendChild(el)});
  discardEl.innerHTML="";
  if(state.pile.length)discardEl.appendChild(card(state.pile[state.pile.length-1],false));
  else discardEl.textContent="YERE ATILAN KARTLAR";
  lastScores=[...state.scores];
}
</script></body></html>
